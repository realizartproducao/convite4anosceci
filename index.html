<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">

<style>
  /* Reset básico e palco em proporção 1080x1920 (9:16), responsivo */
  *{ box-sizing:border-box; }
  html,body{
    margin:0; height:100%; background:#000; overflow:hidden; font-family: system-ui, sans-serif;
    /* Impede o zoom nativo do navegador (pinch e duplo toque). Sem isso, um
       toque duplo perto de um elemento pequeno (como o ícone de play/pausa)
       faz alguns navegadores móveis ampliarem só aquele elemento na tela. */
    touch-action: manipulation;
  }
  .stage{
    position:relative;
    margin:0 auto;
    height:100vh;
    width:calc(100vh * 9 / 16);
    max-width:100vw;
    background:#000;
    overflow:hidden;
  }
  /* Em telas mais largas que altas (ex: notebook), a base passa a ser a largura */
  @media (max-aspect-ratio: 9/16){
    .stage{ width:100vw; height:calc(100vw * 16 / 9); }
  }
  .conv-page{ position:absolute; inset:0; display:none; }
  .conv-page.active{ display:block; }
  .bg{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .lnk{ position:absolute; cursor:pointer; background:transparent; } /* invisível no resultado final */

  /* Vídeo (ou áudio com fundo) + ícone de play/pausa centralizado sobre ele */
  .video-wrap, .audio-wrap{ position:absolute; inset:0; cursor:pointer; }
  .play-pause-icon{
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    /* Unidades relativas ao viewport (não px fixo): assim o ícone escala na
       mesma proporção que o resto da página (que já usa %/vh/vw) sob
       qualquer zoom do navegador, em vez de parecer crescer sozinho. */
    width:8vh; height:8vh; max-width:15vw; max-height:15vw;
    border-radius:50%;
    background:rgba(0,0,0,0.45);
    color:#fff; font-size:3vh;
    display:flex; align-items:center; justify-content:center;
    opacity:0; pointer-events:none;
    transition: opacity .25s ease;
  }
  .play-pause-icon.visible{ opacity:1; }

  /* Player inferior sobre o vídeo (igual ao do aplicativo, mas sem as
     etiquetas de tempo/duração, que existem só no editor).
     Importante: tudo aqui usa uma única unidade de escala baseada em
     min(vh, vw-equivalente) — a mesma técnica do ícone central de
     play/pausa — para acompanhar corretamente a página em QUALQUER
     proporção de tela (a página muda entre "altura cheia" e "largura
     cheia" dependendo da forma da janela) e para nunca crescer fora de
     proporção quando o navegador aplica zoom nativo (desktop ou mobile). */
  .vid-ctrl-zone{
    position:absolute; left:0; right:0; bottom:0;
    height: min(10vh, 17.8vw);
  }
  .vid-ctrl-bar{
    position:absolute; left:0; right:0; bottom:0;
    display:flex; align-items:center; gap: 0.5em;
    padding: 0.45em 0.55em;
    background: linear-gradient(to top, rgba(0,0,0,0.6), rgba(0,0,0,0));
    cursor: default;
    font-size: min(3.8vh, 6.8vw); /* base de escala compartilhada por tudo dentro da barra */
  }
  .vid-ctrl-bar[hidden]{ display:none; }
  .vid-ctrl-btn{
    opacity: 0.6;
    background: rgba(0,0,0,0.45);
    border: 1px solid rgba(255,255,255,0.35);
    color: #fff;
    border-radius: 0.2em;
    width: 1.6em; height: 1.6em;
    font-size: 0.6em; /* tamanho do glyph ▶/■ dentro do botão */
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    flex-shrink:0;
    transition: opacity .15s ease;
  }
  .vid-ctrl-btn:hover{ opacity: 0.95; }
  .vid-ctrl-seek{
    flex:1;
    height: 1em;
    opacity: 0.6;
    accent-color: #fff;
    transition: opacity .15s ease;
  }
  .vid-ctrl-seek:hover{ opacity: 0.95; }
</style>
</head>
<body>

<div class="stage" id="stage">
  <section class="conv-page" data-page="1">
      <div class="video-wrap"><video class="bg conv-video" src="videopagina1.mp4" playsinline loop></video><div class="play-pause-icon"></div><div class="vid-ctrl-zone"><div class="vid-ctrl-bar" hidden><button class="vid-ctrl-btn vid-ctrl-play" title="Reproduzir/Pausar">▶</button><button class="vid-ctrl-btn vid-ctrl-stop" title="Parar">■</button><input type="range" class="vid-ctrl-seek" value="0" min="0" max="100" step="0.1"></div></div></div>
<div class="lnk" style="left:21.29880607532048%;top:77.34365129500947%;width:16.97263528473095%;height:8.48389134554644%" data-dest-type="url" data-dest="https://wa.me/5581986181174?text=Ol%C3%A1!%20Confirmo%20presen%C3%A7a%20no%20anivers%C3%A1rio%20da%20Cec%C3%AD."></div>
      <div class="lnk" style="left:42.41212130351514%;top:77.34365129500947%;width:15.400367129439871%;height:8.483891345546425%" data-dest-type="url" data-dest="https://maps.app.goo.gl/bbD12Z4NBKeuALmo7"></div>
      <div class="lnk" style="left:62.40238784935904%;top:77.46999368288061%;width:15.400367129439843%;height:8.610233733417566%" data-dest-type="page" data-dest="2"></div>
  </section>

  <section class="conv-page" data-page="2">
      <img class="bg" src="fundopagina2.jpg" alt="">
<div class="lnk" style="left:43.759779722336084%;top:79.4914718888187%;width:15.624976865910014%;height:8.104864181933038%" data-dest-type="page" data-dest="1"></div>
  </section>
</div>

<script>
  // -----------------------------------------------------------------
  // Navegação entre páginas do convite + reprodução de mídia
  // -----------------------------------------------------------------
  var pages = Array.prototype.slice.call(document.querySelectorAll('.conv-page'));

  function pageEl(n){
    return document.querySelector('.conv-page[data-page="' + n + '"]');
  }

  // autoplay=false na primeira chamada (página 1 ao carregar): o vídeo/áudio
  // só deve começar depois que o usuário clicar (política de autoplay dos
  // navegadores + comportamento pedido: ícone de play visível na página 1
  // até o clique). Nas trocas de página seguintes (via clique em um link,
  // que já é uma interação do usuário), autoplay=true por padrão.
  function showPage(n, autoplay){
    if (autoplay === undefined) autoplay = true;
    pages.forEach(function(p){
      var isTarget = p.getAttribute('data-page') === String(n);
      p.classList.toggle('active', isTarget);
      var video = p.querySelector('.conv-video');
      var audio = p.querySelector('.conv-audio');
      if (isTarget){
        if (autoplay){
          if (video) video.play().catch(function(){});
          if (audio) audio.play().catch(function(){});
        }
      } else {
        if (video) video.pause();
        if (audio) audio.pause();
      }
    });
  }

  // -----------------------------------------------------------------
  // Ícone de play/pausa centralizado em cada vídeo: visível enquanto
  // pausado; ao tocar, o vídeo toca e o ícone de pausa aparece por 1s e
  // some sozinho; tocar novamente no vídeo alterna play/pausa a qualquer
  // momento e volta a mostrar o ícone correspondente.
  function setupVideoControls(){
    var videos = document.querySelectorAll('.conv-video');
    videos.forEach(function(video){
      var wrap = video.parentElement;
      var icon = wrap.querySelector('.play-pause-icon');
      var hideTimer = null;

      function updateIconLabel(){
        icon.textContent = video.paused ? '▶' : '❚❚';
      }
      function flashIcon(){
        updateIconLabel();
        icon.classList.add('visible');
      }

      video.addEventListener('play', function(){
        flashIcon();
        clearTimeout(hideTimer);
        hideTimer = setTimeout(function(){ icon.classList.remove('visible'); }, 1000);
      });
      video.addEventListener('pause', function(){
        clearTimeout(hideTimer);
        flashIcon(); // pausado: ícone de play fica visível até o próximo clique
      });

      // ---- Player inferior (play/pausa, parar, barra de progresso) ----
      // Mesmo comportamento do player do aplicativo (editor), só que sem as
      // etiquetas de tempo/duração, que existem apenas lá.
      var zone = wrap.querySelector('.vid-ctrl-zone');
      var bar = wrap.querySelector('.vid-ctrl-bar');
      var barHideTimer = null;

      if (bar) {
        var playBtn = bar.querySelector('.vid-ctrl-play');
        var stopBtn = bar.querySelector('.vid-ctrl-stop');
        var seekEl = bar.querySelector('.vid-ctrl-seek');

        function updateBarPlayLabel(){
          playBtn.textContent = video.paused ? '▶' : '❚❚';
        }
        // O ícone do botão reflete o estado real do vídeo (evento nativo
        // play/pause), não só o clique no próprio botão — assim ele fica
        // sincronizado com o ícone central de play/pausa também.
        video.addEventListener('play', updateBarPlayLabel);
        video.addEventListener('pause', updateBarPlayLabel);
        playBtn.addEventListener('click', function(){
          if (video.paused) video.play().catch(function(){});
          else video.pause();
        });
        stopBtn.addEventListener('click', function(){
          video.pause();
          video.currentTime = 0;
        });
        video.addEventListener('timeupdate', function(){
          if (video.duration) seekEl.value = (video.currentTime / video.duration) * 100;
        });
        seekEl.addEventListener('input', function(){
          if (video.duration) video.currentTime = (seekEl.value / 100) * video.duration;
        });

        // Impede que cliques/arrastes na barra cheguem ao clique de
        // play/pausa do vídeo (wrap).
        bar.addEventListener('pointerdown', function(ev){ ev.stopPropagation(); });
        bar.addEventListener('click', function(ev){ ev.stopPropagation(); });

        // A "zona" cobre a mesma faixa inferior, mas continua presente
        // mesmo com a barra escondida — detecta o mouse chegando ali e
        // reaparece o player enquanto o vídeo está tocando.
        zone.addEventListener('mouseenter', function(){
          clearTimeout(barHideTimer);
          if (!video.paused) bar.hidden = false;
        });
        zone.addEventListener('mouseleave', function(){
          clearTimeout(barHideTimer);
          barHideTimer = setTimeout(function(){ bar.hidden = true; }, 1000);
        });
      }

      // ---- Intervalo de tempo em que os links da página ficam clicáveis ----
      // Só existe quando o usuário definiu início e fim válidos no editor
      // (ver data-link-start/data-link-end, em segundos). Fora desse
      // intervalo, os links da página ficam com "pointer-events:none",
      // ou seja, clicáveis apenas durante o intervalo programado.
      if (wrap.hasAttribute('data-link-start') && wrap.hasAttribute('data-link-end')) {
        var linkStartSec = parseFloat(wrap.getAttribute('data-link-start'));
        var linkEndSec = parseFloat(wrap.getAttribute('data-link-end'));
        var pageEl = wrap.closest('.conv-page');
        var pageLinks = pageEl ? pageEl.querySelectorAll('.lnk') : [];

        function updateLinksClickable(){
          var t = video.currentTime;
          var withinInterval = t >= linkStartSec && t <= linkEndSec;
          pageLinks.forEach(function(lnk){
            lnk.style.pointerEvents = withinInterval ? '' : 'none';
          });
        }
        video.addEventListener('timeupdate', updateLinksClickable);
        video.addEventListener('seeked', updateLinksClickable);
        // Também atualiza durante o próprio arraste da bolinha do player
        // inferior, para nunca ficar com o estado desatualizado.
        if (bar) {
          var seekElForLinks = bar.querySelector('.vid-ctrl-seek');
          if (seekElForLinks) seekElForLinks.addEventListener('input', updateLinksClickable);
        }
        updateLinksClickable(); // estado inicial (vídeo começa em 0:00, pausado)
      }

      wrap.addEventListener('click', function(){
        if (video.paused) {
          video.play().catch(function(){});
          if (bar) { clearTimeout(barHideTimer); bar.hidden = false; }
        } else {
          video.pause();
          if (bar) { clearTimeout(barHideTimer); bar.hidden = true; }
        }
      });

      flashIcon(); // estado inicial: vídeo começa pausado, ícone de play visível
    });
  }

  // Mesmo comportamento acima, mas para páginas com fundo (imagem) + áudio,
  // sem vídeo: o ícone central de play/pausa controla a reprodução do áudio.
  function setupAudioControls(){
    var wraps = document.querySelectorAll('.audio-wrap');
    wraps.forEach(function(wrap){
      var audio = wrap.querySelector('.conv-audio');
      var icon = wrap.querySelector('.play-pause-icon');
      var hideTimer = null;

      function updateIconLabel(){
        icon.textContent = audio.paused ? '▶' : '❚❚';
      }
      function flashIcon(){
        updateIconLabel();
        icon.classList.add('visible');
      }

      audio.addEventListener('play', function(){
        flashIcon();
        clearTimeout(hideTimer);
        hideTimer = setTimeout(function(){ icon.classList.remove('visible'); }, 1000);
      });
      audio.addEventListener('pause', function(){
        clearTimeout(hideTimer);
        flashIcon(); // pausado: ícone de play fica visível até o próximo clique
      });
      wrap.addEventListener('click', function(){
        if (audio.paused) audio.play().catch(function(){});
        else audio.pause();
      });

      flashIcon(); // estado inicial: áudio começa pausado, ícone de play visível
    });
  }

  // Clique em qualquer retângulo de link: navega para outra página ou abre URL
  document.addEventListener('click', function(ev){
    var lnk = ev.target.closest('.lnk');
    if (!lnk) return;
    var destType = lnk.getAttribute('data-dest-type');
    var dest = lnk.getAttribute('data-dest');
    if (!dest) return;
    if (destType === 'page') showPage(dest);
    else window.open(dest, '_blank', 'noopener');
  });

  // Primeiro clique do usuário em qualquer lugar da página: libera o áudio
  // da página atual (se houver) e o autoplay com som das próximas páginas.
  // Se a página tiver vídeo, ou um ícone de play/pausa de áudio, o próprio
  // clique neles já dispara isso — por isso ambos são ignorados aqui, senão
  // o mesmo clique tocaria e pausaria o áudio ao mesmo tempo.
  document.addEventListener('click', function(ev){
    if (ev.target.closest('.audio-wrap') || ev.target.closest('.video-wrap')) return;
    var activePage = document.querySelector('.conv-page.active');
    if (activePage){
      var audio = activePage.querySelector('.conv-audio');
      if (audio && audio.paused) audio.play().catch(function(){});
    }
  }, { once: true, capture: true });

  setupVideoControls();
  setupAudioControls();

  // Bloqueio extra do zoom nativo: alguns navegadores (principalmente o
  // Safari/iOS) ignoram "user-scalable=no" do <meta viewport> por questões
  // de acessibilidade. O evento "gesturestart" (pinça com dois dedos) é
  // específico do WebKit/Safari e cancelá-lo impede esse zoom nativo.
  document.addEventListener('gesturestart', function(ev){ ev.preventDefault(); });

  // Bloqueio do "zoom por duplo toque": impede que um toque duplo rápido em
  // qualquer ponto (inclusive perto do ícone de play/pausa) faça o navegador
  // ampliar apenas aquele elemento na tela.
  var lastTouchEnd = 0;
  document.addEventListener('touchend', function(ev){
    var now = Date.now();
    if (now - lastTouchEnd <= 350) ev.preventDefault();
    lastTouchEnd = now;
  }, { passive: false });

  // Bloqueio do zoom nativo em desktop pelo "Ctrl + roda do mouse" (o
  // navegador dispara "wheel" com ctrlKey=true tanto nesse atalho quanto no
  // gesto de pinça do trackpad; cancelar o evento impede o zoom nativo).
  window.addEventListener('wheel', function(ev){
    if (ev.ctrlKey) ev.preventDefault();
  }, { passive: false });
  // Observação: o atalho de teclado "Ctrl + +/-" para zoom é controlado
  // diretamente pelo navegador e nenhuma página consegue bloqueá-lo — por
  // isso o ícone de play/pausa acima usa unidades relativas ao viewport
  // (vh/vw) em vez de pixels fixos: caso esse zoom aconteça mesmo assim,
  // tudo na página escala junto, na mesma proporção, em vez de só o ícone.

  // Abre direto na página 1, mas sem iniciar vídeo/áudio automaticamente:
  // a página 1 mostra o ícone de play visível, aguardando o toque do usuário.
  showPage('1', false);
</script>
</body>
</html>
